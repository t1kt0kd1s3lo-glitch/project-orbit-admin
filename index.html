<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orbit Dashboard</title>
  <style>
    /* ── Calm Base Styles ── */
    :root {
      --bg: #0d0f14; /* Deep, neutral dark */
      --panel: #161b27; /* Distinct card background */
      --border: #2a3044; /* Subtle borders */
      --accent: #4d6eff; /* Professional blue */
      --text: #e2e8f0;
      --text-dim: #64748b;
      --green: #4ade80;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh;
    }

    /* ── Calm Login ── */
    #login-screen { 
      display: flex; align-items: center; justify-content: center; min-height: 100vh; 
      background: var(--bg);
    }
    .login-box { 
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; 
      padding: 40px; width: 100%; max-width: 380px; text-align: center;
    }
    .login-box .logo { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .login-box p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }
    .login-box input { 
      width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); 
      border-radius: 8px; color: #fff; margin-bottom: 16px; outline: none;
    }

    /* ── Basic Sidebar Layout ── */
    #app { display: none; min-height: 100vh; }
    .sidebar { 
      position: fixed; width: 220px; height: 100vh; background: var(--panel); 
      border-right: 1px solid var(--border); display: flex; flex-direction: column; 
    }
    .sidebar-logo { padding: 24px; font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--border); }
    .nav-item { 
      padding: 14px 24px; cursor: pointer; color: var(--text-dim); transition: 0.2s; 
      font-weight: 500; display: flex; align-items: center; gap: 10px;
    }
    .nav-item:hover { background: #1e2436; color: #fff; }
    .nav-item.active { color: var(--accent); background: #1e2436; border-left: 3px solid var(--accent); }

    .main { margin-left: 220px; padding: 40px; }
    .page { display: none; }
    .page.active { display: block; }

    /* ── Standard Cards ── */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 20px; color: #fff; }

    /* ── Clean Form Elements ── */
    .btn { 
      padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; 
      border: none; transition: opacity 0.2s; font-size: 0.9rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #1e2436; color: var(--text-dim); border: 1px solid var(--border); }
    .btn:hover { opacity: 0.9; }

    /* ── Shop Grid ── */
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .shop-item { 
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; 
      padding: 16px; position: relative;
    }
    .shop-item-name { font-weight: 600; margin-bottom: 4px; }
    .shop-item-id { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 12px; word-break: break-all; }
    .shop-item-price { color: #a78bfa; font-weight: 700; }
