<div class="nav-item" onclick="showPage('news')">News Feed</div>

<div class="page" id="page-news">
  <div class="card">
    <div class="card-title">Broadcast News</div>
    <div class="form-group" style="margin-bottom:15px">
      <label style="color:var(--text-dim); font-size:0.8rem; display:block; margin-bottom:5px;">Header Title</label>
      <input type="text" id="news-title" placeholder="e.g. V0.0.1 UPDATE IS LIVE!" style="width:100%; padding:10px; background:#0d0f14; border:1px solid var(--border); color:white; border-radius:8px;">
    </div>
    <div class="form-group" style="margin-bottom:15px">
      <label style="color:var(--text-dim); font-size:0.8rem; display:block; margin-bottom:5px;">Content Body</label>
      <textarea id="news-body" placeholder="Describe the update..." style="width:100%; height:100px; padding:10px; background:#0d0f14; border:1px solid var(--border); color:white; border-radius:8px; resize:none;"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:15px">
      <label style="color:var(--text-dim); font-size:0.8rem; display:block; margin-bottom:5px;">Image URL (1024x512)</label>
      <input type="text" id="news-image" placeholder="https://i.imgur.com/your-image.png" style="width:100%; padding:10px; background:#0d0f14; border:1px solid var(--border); color:white; border-radius:8px;">
    </div>
    <button class="btn btn-purple" onclick="pushNews()">📡 Push News Update</button>
  </div>
</div>

<script>
  // Add this to your script section
  async function pushNews() {
    const title = document.getElementById('news-title').value;
    const body = document.getElementById('news-body').value;
    const image = document.getElementById('news-image').value;

    const res = await fetch('/api/news', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body, image })
    });

    if (res.ok) {
      alert("News Pushed Successfully!");
    } else {
      alert("Failed to push news.");
    }
  }
</script>
