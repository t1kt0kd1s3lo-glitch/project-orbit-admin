<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orbit Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0d0f14;color:#e2e8f0;min-height:100vh}

    /* ── Login ── */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d0f14 0%,#1a1f2e 100%)}
    .login-box{background:#161b27;border:1px solid #2a3044;border-radius:16px;padding:48px 40px;width:100%;max-width:380px;text-align:center}
    .login-box .logo{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#4d6eff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .login-box p{color:#64748b;margin-bottom:32px;font-size:.9rem}
    .login-box input{width:100%;padding:12px 16px;background:#0d0f14;border:1px solid #2a3044;border-radius:8px;color:#e2e8f0;font-size:1rem;margin-bottom:16px;outline:none;transition:border .2s}
    .login-box input:focus{border-color:#4d6eff}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s}
    .btn-primary{background:linear-gradient(135deg,#4d6eff,#a855f7);color:#fff}
    .btn-primary:hover{opacity:.85}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .error-msg{color:#f87171;font-size:.85rem;margin-top:8px}

    /* ── App Shell ── */
    #app{display:none}
    .sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:#161b27;border-right:1px solid #2a3044;display:flex;flex-direction:column;z-index:10}
    .sidebar-logo{padding:24px 20px;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#4d6eff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;border-bottom:1px solid #2a3044}
    .nav-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;color:#64748b;font-size:.9rem;font-weight:500;transition:all .15s;border-left:3px solid transparent}
    .nav-item:hover{color:#e2e8f0;background:#1e2436}
    .nav-item.active{color:#4d6eff;background:#1e2436;border-left-color:#4d6eff}
    .nav-item svg{width:18px;height:18px;flex-shrink:0}
    .sidebar-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #2a3044}
    .logout-btn{width:100%;padding:10px;background:transparent;border:1px solid #2a3044;border-radius:8px;color:#64748b;cursor:pointer;font-size:.85rem;transition:all .2s}
    .logout-btn:hover{border-color:#f87171;color:#f87171}

    .main{margin-left:220px;padding:32px;min-height:100vh}
    .page{display:none}
    .page.active{display:block}
    .page-title{font-size:1.5rem;font-weight:700;margin-bottom:4px}
    .page-sub{color:#64748b;font-size:.9rem;margin-bottom:28px}

    /* ── Cards ── */
    .card{background:#161b27;border:1px solid #2a3044;border-radius:12px;padding:24px;margin-bottom:20px}
    .card-title{font-size:1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
    .badge-green{background:#14532d22;color:#4ade80;border:1px solid #4ade8033}
    .badge-red{background:#7f1d1d22;color:#f87171;border:1px solid #f8717133}
    .badge-blue{background:#1e3a8a22;color:#60a5fa;border:1px solid #60a5fa33}

    /* ── Form controls ── */
    label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:6px;font-weight:500}
    input[type=text],input[type=password],input[type=number],input[type=datetime-local],textarea,select{
      width:100%;padding:10px 14px;background:#0d0f14;border:1px solid #2a3044;border-radius:8px;
      color:#e2e8f0;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    input:focus,textarea:focus,select:focus{border-color:#4d6eff}
    textarea{resize:vertical;min-height:80px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-group{margin-bottom:16px}
    .form-actions{display:flex;gap:12px;margin-top:8px}
    .btn-sm{padding:8px 18px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s}
    .btn-green{background:#166534;color:#4ade80}
    .btn-green:hover{opacity:.85}
    .btn-red{background:#7f1d1d;color:#f87171}
    .btn-red:hover{opacity:.85}
    .btn-purple{background:linear-gradient(135deg,#4d6eff,#a855f7);color:#fff}
    .btn-purple:hover{opacity:.85}
    .btn-ghost{background:#1e2436;color:#94a3b8;border:1px solid #2a3044}
    .btn-ghost:hover{border-color:#4d6eff;color:#e2e8f0}

    /* ── Shop items table ── */
    .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px}
    .shop-item{background:#0d0f14;border:1px solid #2a3044;border-radius:10px;padding:16px;position:relative}
    .shop-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .shop-item-type{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
    .shop-item-name{font-size:.95rem;font-weight:600;margin-bottom:4px;color:#e2e8f0}
    .shop-item-id{font-size:.75rem;color:#64748b;font-family:monospace;margin-bottom:10px;word-break:break-all}
    .shop-item-price{font-size:1.1rem;font-weight:700;color:#a78bfa}
    .shop-item-price::before{content:"⚡ ";font-size:.8rem}
    .remove-item{position:absolute;top:10px;right:10px;background:transparent;border:none;color:#f8717188;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;transition:color .2s}
    .remove-item:hover{color:#f87171}
    .add-item-card{background:#0d0f14;border:2px dashed #2a3044;border-radius:10px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#64748b;transition:all .2s;min-height:160px}
    .add-item-card:hover{border-color:#4d6eff;color:#4d6eff}
    .add-item-card svg{width:28px;height:28px}

    /* ── Modal ── */
    .modal-overlay{display:none;position:fixed;inset:0;background:#000a;z-index:100;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#161b27;border:1px solid #2a3044;border-radius:14px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.1rem;font-weight:700;margin-bottom:20px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

    /* ── Toast ── */
    #toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:.9rem;font-weight:500;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
    #toast.show{opacity:1;transform:translateY(0)}
    #toast.success{background:#166534;color:#4ade80;border:1px solid #4ade8033}
    #toast.error{background:#7f1d1d;color:#f87171;border:1px solid #f8717133}

    /* ── Tournament ── */
    .tournament-status{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .status-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
    .status-dot.inactive{background:#64748b;box-shadow:none}

    /* ── Responsive ── */
    @media(max-width:768px){
      .sidebar{width:60px}
      .sidebar-logo,.nav-label,.sidebar-bottom{display:none}
      .main{margin-left:60px;padding:16px}
      .form-row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- ── Login Screen ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">⚡ Orbit</div>
    <p>Admin Dashboard — sign in to continue</p>
    <input type="password" id="pwd-input" placeholder="Admin password" />
    <button class="btn btn-primary" id="login-btn">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">⚡ Orbit</div>
    <nav>
      <div class="nav-item active" data-page="shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="nav-label">Item Shop</span>
      </div>
      <div class="nav-item" data-page="tournament">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M5 3h14l-1 9a7 7 0 01-12 0L5 3z"/><path d="M5 3H3m16 0h2"/></svg>
        <span class="nav-label">Tournament</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <!-- ── Item Shop Page ── -->
    <div class="page active" id="page-shop">
      <div class="page-title">Item Shop</div>
      <div class="page-sub">Manage daily &amp; featured shop items</div>

      <div class="card">
        <div class="card-title">
          Actions
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn-sm btn-purple" id="btn-refresh-shop">🔄 Rotate Shop Now</button>
          <button class="btn-sm btn-ghost" id="btn-reload-shop">↺ Reload from Server</button>
          <button class="btn-sm btn-green" id="btn-save-shop">💾 Save Shop</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Daily Items <span class="badge badge-blue" id="daily-count">0</span></div>
        <div class="shop-grid" id="daily-grid"></div>
      </div>

      <div class="card">
        <div class="card-title">Featured Items <span class="badge badge-blue" id="featured-count">0</span></div>
        <div class="shop-grid" id="featured-grid"></div>
      </div>
    </div>

    <!-- ── Tournament Page ── -->
    <div class="page" id="page-tournament">
      <div class="page-title">Tournament Manager</div>
      <div class="page-sub">Create and manage in-game tournaments</div>

      <div class="card">
        <div class="card-title">Current Status</div>
        <div class="tournament-status">
          <div class="status-dot inactive" id="tournament-dot"></div>
          <span id="tournament-status-text">No active tournament</span>
        </div>
        <div id="active-tournament-info" style="display:none">
          <div style="background:#0d0f14;border:1px solid #2a3044;border-radius:8px;padding:16px;margin-bottom:16px">
            <div style="font-size:1.1rem;font-weight:700;margin-bottom:4px" id="active-name"></div>
            <div style="color:#64748b;font-size:.85rem;margin-bottom:8px" id="active-times"></div>
            <div style="color:#94a3b8;font-size:.9rem" id="active-desc"></div>
          </div>
          <button class="btn-sm btn-red" id="btn-end-tournament">🏁 End Tournament</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Create Tournament</div>
        <div class="form-row">
          <div class="form-group">
            <label>Tournament Name</label>
            <input type="text" id="t-name" placeholder="e.g. Friday Night Fights"/>
          </div>
          <div class="form-group">
            <label>Prize / Reward</label>
            <input type="text" id="t-prize" placeholder="e.g. 5000 V-Bucks"/>
          </div>
        </div>
        <div class="form-group">
          <label>Description / Rules</label>
          <textarea id="t-desc" placeholder="Describe the tournament rules, format, etc."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Time (UTC)</label>
            <input type="datetime-local" id="t-start"/>
          </div>
          <div class="form-group">
            <label>End Time (UTC)</label>
            <input type="datetime-local" id="t-end"/>
          </div>
        </div>
        <div class="form-group">
          <label>Playlist ID (optional)</label>
          <input type="text" id="t-playlist" placeholder="Playlist_ShowdownTournament_Solo"/>
        </div>
        <div class="form-actions">
          <button class="btn-sm btn-purple" id="btn-start-tournament">🏆 Start Tournament</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── Add Item Modal ── -->
<div class="modal-overlay" id="add-item-modal">
  <div class="modal">
    <div class="modal-title">Add Shop Item</div>
    <div class="form-group">
      <label>Section</label>
      <select id="new-item-section">
        <option value="daily">Daily</option>
        <option value="featured">Featured</option>
      </select>
    </div>
    <div class="form-group">
      <label>Template ID</label>
      <input type="text" id="new-item-template" placeholder="e.g. AthenaCharacter:CID_001_Athena_Commando_F_Default"/>
    </div>
    <div class="form-group">
      <label>Display Name (optional)</label>
      <input type="text" id="new-item-name" placeholder="Auto-derived if empty"/>
    </div>
    <div class="form-group">
      <label>Price (V-Bucks)</label>
      <input type="number" id="new-item-price" value="800" min="0"/>
    </div>
    <div class="modal-actions">
      <button class="btn-sm btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn-sm btn-purple" id="modal-confirm">Add Item</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let shopData = { daily: [], featured: [] };
let activeTournament = null;
let addingToSection = "daily";

// ── Utilities ──────────────────────────────────────────────────────────────────
function toast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "", 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { showLogin(); return null; }
  return res.ok ? res.json() : null;
}

// ── Auth ───────────────────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const pwd = document.getElementById("pwd-input").value;
  const btn = document.getElementById("login-btn");
  btn.disabled = true;
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pwd }),
  });
  btn.disabled = false;
  if (res.ok) {
    showApp();
    loadShop();
  } else {
    document.getElementById("login-error").textContent = "Incorrect password.";
  }
});

document.getElementById("pwd-input").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  showLogin();
});

// ── Navigation ─────────────────────────────────────────────────────────────────
document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    item.classList.add("active");
    const page = item.dataset.page;
    document.getElementById("page-" + page).classList.add("active");
    if (page === "shop") loadShop();
    if (page === "tournament") loadTournament();
  });
});

// ── Shop ───────────────────────────────────────────────────────────────────────
async function loadShop() {
  const data = await api("/api/shop");
  if (!data) return;

  shopData = { daily: [], featured: [] };

  const storefronts = data.storefronts || [];
  for (const sf of storefronts) {
    const section = sf.name === "BRDailyStorefront" ? "daily" : "featured";
    for (const entry of (sf.catalogEntries || [])) {
      const grant = entry.itemGrants?.[0]?.templateId || "";
      const price = entry.prices?.[0]?.finalPrice ?? 0;
      const name  = entry.title || deriveName(grant);
      shopData[section].push({ templateId: grant, name, price });
    }
  }
  renderShop();
}

function deriveName(templateId) {
  const parts = (templateId.split(":")[1] || templateId).split("_");
  return parts.slice(Math.max(0, parts.length - 2)).join(" ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function renderShop() {
  renderSection("daily", "daily-grid", "daily-count");
  renderSection("featured", "featured-grid", "featured-count");
}

function renderSection(section, gridId, countId) {
  const grid = document.getElementById(gridId);
  document.getElementById(countId).textContent = shopData[section].length;
  grid.innerHTML = "";

  shopData[section].forEach((item, idx) => {
    const type = item.templateId.split(":")[0] || "";
    const div = document.createElement("div");
    div.className = "shop-item";
    div.innerHTML = `
      <button class="remove-item" data-section="${section}" data-idx="${idx}" title="Remove">✕</button>
      <div class="shop-item-type">${type}</div>
      <div class="shop-item-name">${item.name}</div>
      <div class="shop-item-id">${item.templateId}</div>
      <div class="shop-item-price">${item.price}</div>
    `;
    grid.appendChild(div);
  });

  // Add button
  const add = document.createElement("div");
  add.className = "add-item-card";
  add.dataset.section = section;
  add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Item</span>`;
  grid.appendChild(add);
}

document.addEventListener("click", e => {
  // Remove item
  const rm = e.target.closest(".remove-item");
  if (rm) {
    const { section, idx } = rm.dataset;
    shopData[section].splice(parseInt(idx), 1);
    renderShop();
    return;
  }
  // Open add modal
  const add = e.target.closest(".add-item-card");
  if (add) {
    addingToSection = add.dataset.section;
    document.getElementById("new-item-section").value = addingToSection;
    document.getElementById("add-item-modal").classList.add("open");
    document.getElementById("new-item-template").value = "";
    document.getElementById("new-item-name").value = "";
    document.getElementById("new-item-price").value = "800";
  }
});

document.getElementById("modal-cancel").addEventListener("click", () => {
  document.getElementById("add-item-modal").classList.remove("open");
});

document.getElementById("modal-confirm").addEventListener("click", () => {
  const section   = document.getElementById("new-item-section").value;
  const templateId = document.getElementById("new-item-template").value.trim();
  const nameVal   = document.getElementById("new-item-name").value.trim();
  const price     = parseInt(document.getElementById("new-item-price").value) || 0;

  if (!templateId) { toast("Template ID is required", "error"); return; }

  const name = nameVal || deriveName(templateId);
  shopData[section].push({ templateId, name, price });
  renderShop();
  document.getElementById("add-item-modal").classList.remove("open");
});

document.getElementById("btn-refresh-shop").addEventListener("click", async () => {
  if (!confirm("This will rotate the shop to new random items. Continue?")) return;
  const res = await api("/api/shop", { method: "PUT" });
  if (res?.ok) { toast("Shop rotated! Reloading..."); setTimeout(loadShop, 800); }
  else toast("Failed to rotate shop", "error");
});

document.getElementById("btn-reload-shop").addEventListener("click", loadShop);

document.getElementById("btn-save-shop").addEventListener("click", async () => {
  // Build items array for catalog_config format
  const items = [
    ...shopData.daily.map((item, i) => ({ key: `daily${i+1}`, itemGrants: [item.templateId], price: item.price })),
    ...shopData.featured.map((item, i) => ({ key: `featured${i+1}`, itemGrants: [item.templateId], price: item.price })),
  ];
  const res = await api("/api/shop", { method: "POST", body: { items } });
  if (res?.ok) toast("Shop saved!");
  else toast("Failed to save shop", "error");
});

// ── Tournament ─────────────────────────────────────────────────────────────────
async function loadTournament() {
  const data = await api("/api/tournament");
  if (!data) return;

  const events = data.events || [];
  const active = events.find(e => e.eventId?.startsWith("OrbitTournament_"));

  const dot    = document.getElementById("tournament-dot");
  const status = document.getElementById("tournament-status-text");
  const info   = document.getElementById("active-tournament-info");

  if (active) {
    activeTournament = active;
    dot.classList.remove("inactive");
    status.textContent = "Tournament active";
    info.style.display = "block";
    document.getElementById("active-name").textContent = active.eventId?.replace("OrbitTournament_", "") || "Tournament";
    const windows = active.eventWindows?.[0] || {};
    const start = windows.beginTime ? new Date(windows.beginTime).toLocaleString() : "?";
    const end   = windows.endTime   ? new Date(windows.endTime).toLocaleString()   : "?";
    document.getElementById("active-times").textContent = `${start} → ${end}`;
    document.getElementById("active-desc").textContent = active.eventGroup || "";
  } else {
    activeTournament = null;
    dot.classList.add("inactive");
    status.textContent = "No active tournament";
    info.style.display = "none";
  }
}

document.getElementById("btn-start-tournament").addEventListener("click", async () => {
  const name   = document.getElementById("t-name").value.trim();
  const desc   = document.getElementById("t-desc").value.trim();
  const start  = document.getElementById("t-start").value;
  const end    = document.getElementById("t-end").value;
  const prize  = document.getElementById("t-prize").value.trim();
  const playlist = document.getElementById("t-playlist").value.trim();

  if (!name || !start || !end) { toast("Name, start, and end are required", "error"); return; }

  const res = await api("/api/tournament", {
    method: "POST",
    body: {
      name, description: desc,
      start: new Date(start).toISOString(),
      end:   new Date(end).toISOString(),
      prize, playlist,
    },
  });
  if (res?.ok) { toast("Tournament started!"); loadTournament(); }
  else toast("Failed to start tournament", "error");
});

document.getElementById("btn-end-tournament").addEventListener("click", async () => {
  if (!confirm("End the current tournament?")) return;
  const res = await api("/api/tournament", { method: "DELETE" });
  if (res?.ok) { toast("Tournament ended"); loadTournament(); }
  else toast("Failed to end tournament", "error");
});

// ── Boot ───────────────────────────────────────────────────────────────────────
// Check if already logged in by pinging the shop API
(async () => {
  const res = await fetch("/api/shop");
  if (res.status === 200) { showApp(); loadShop(); }
  else showLogin();
})();
</script>
