<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orbit Admin</title>
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #161b27;
      --border: #2a3044;
      --accent: #4d6eff;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 999; background: var(--bg); }
    .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; text-align: center; }
    .login-box input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 16px; outline: none; }

    /* ── Sidebar ── */
    #app { display: none; }
    .sidebar { position: fixed; width: 220px; height: 100vh; background: var(--panel); border-right: 1px solid var(--border); }
    .sidebar-logo { padding: 24px; font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--border); }
    .nav-item { padding: 14px 24px; cursor: pointer; color: var(--text-dim); font-weight: 600; transition: 0.2s; }
    .nav-item:hover { color: #fff; background: #1e2436; }
    .nav-item.active { color: var(--accent); background: #1e2436; border-left: 3px solid var(--accent); }

    /* ── Main Content ── */
    .main { margin-left: 220px; padding: 40px; }
    .page { display: none; }
    .page.active { display: block; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    
    /* ── Controls ── */
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #1e2436; color: var(--text-dim); border: 1px solid var(--border); }
    
    /* ── Shop Grid ── */
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
    .shop-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; position: relative; }
    .remove-item { position: absolute; top: 10px; right: 10px; color: var(--red); cursor: pointer; background: none; border: none; font-weight: bold; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="logo">Orbit</div>
    <p style="color: var(--text-dim); margin-bottom: 24px;">Admin Portal</p>
    <input type="password" id="pwd-input" placeholder="Password" />
    <button class="btn btn-primary" style="width:100%" id="login-btn">Sign In</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">Orbit Admin</div>
    <nav style="padding-top: 20px;">
      <div class="nav-item active" onclick="showPage('shop')">Shop</div>
      <div class="nav-item" onclick="showPage('tournament')">Tournament</div>
    </nav>
  </aside>

  <main class="main">
    <div class="page active" id="page-shop">
      <div class="card">
        <h2>Item Shop Control</h2>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button class="btn btn-primary" onclick="saveShop()">Save Shop</button>
          <button class="btn btn-ghost" onclick="rotateShop()">Rotate Shop Now</button>
        </div>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
    </div>

    <div class="page" id="page-tournament">
      <div class="card">
        <h2>Tournament Manager</h2>
        <p style="color: var(--text-dim); margin-top: 10px;">Create and end active events.</p>
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 400px;">
            <input type="text" id="t-name" placeholder="Tournament Name" style="padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); color: white;">
            <button class="btn btn-primary" onclick="startTournament()">Start Tournament</button>
            <button class="btn btn-ghost" style="color: var(--red); border-color: var(--red);" onclick="endTournament()">End Tournament</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // Navigation
  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    event.target.classList.add('active');
  }

  // Auth Logic
  document.getElementById('login-btn').addEventListener('click', async () => {
    const password = document.getElementById('pwd-input').value;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (res.ok) { document.getElementById('login-screen').style.display = 'none'; document.getElementById('app').style.display = 'block'; loadShop(); }
  });

  // Shop Logic
  async function loadShop() {
    const res = await fetch('/api/shop');
    const data = await res.json();
    const grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    data.storefronts.forEach(sf => {
        sf.catalogEntries.forEach(entry => {
            const item = document.createElement('div');
            item.className = 'shop-item';
            item.innerHTML = `<strong>${entry.devName || 'Unknown Item'}</strong><br><span style="color:var(--text-dim); font-size:0.8rem;">${entry.offerId}</span><br><br><span style="color:var(--accent)">${entry.prices[0].finalPrice} V-Bucks</span>`;
            grid.appendChild(item);
        });
    });
  }

  async function rotateShop() { await fetch('/api/shop', { method: 'PUT' }); loadShop(); }
  async function saveShop() { /* Logic for POST to /api/shop */ }

  // Tournament Logic
  async function startTournament() {
    const name = document.getElementById('t-name').value;
    await fetch('/api/tournament', { method: 'POST', body: JSON.stringify({ name, start: new Date().toISOString(), end: new Date(Date.now() + 86400000).toISOString() }), headers: {'Content-Type': 'application/json'} });
  }
  async function endTournament() { await fetch('/api/tournament', { method: 'DELETE' }); }
</script>
</body>
</html>
