<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orbit // Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030305;
      --panel: rgba(13, 13, 21, 0.85);
      --panel-border: rgba(0, 242, 255, 0.2);
      --accent: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.4);
      --purple: #7000ff;
      --text: #ffffff;
      --text-dim: #6b7280;
      --danger: #ff0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(112, 0, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.05) 0%, transparent 50%);
    }

    /* ── Login Box (Cyber-Cut) ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { 
      background: var(--panel); 
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border); 
      padding: 40px; width: 100%; max-width: 400px;
      clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
    }
    .login-box .logo { 
      font-family: 'JetBrains Mono'; font-weight: 900; font-size: 1.8rem; 
      color: var(--accent); margin-bottom: 24px; text-shadow: 0 0 10px var(--accent-glow);
    }
    .login-box input { 
      width: 100%; padding: 14px; background: rgba(0,0,0,0.4); 
      color: #fff; margin-bottom: 16px; border: 1px solid var(--panel-border);
    }

    /* ── HUD Sidebar ── */
    #app { display: none; height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    .sidebar { background: rgba(8, 8, 12, 0.95); border-right: 1px solid var(--panel-border); padding: 20px; }
    .sidebar-logo { font-family: 'JetBrains Mono'; font-weight: 900; color: var(--accent); margin-bottom: 40px; font-size: 1.2rem; }
    .nav-item { 
      padding: 12px 16px; margin-bottom: 8px; cursor: pointer;
      transition: 0.2s; color: var(--text-dim); font-family: 'JetBrains Mono';
      font-weight: 700; text-transform: uppercase; font-size: 0.8rem; border-left: 2px solid transparent;
    }
    .nav-item.active { 
      color: var(--accent); border-left: 2px solid var(--accent); 
      background: rgba(0, 242, 255, 0.05);
    }

    .main { padding: 40px; overflow-y: auto; }
    .card { 
      background: var(--panel); border: 1px solid var(--panel-border); 
      padding: 24px; margin-bottom: 30px; position: relative;
    }
    .card-title { 
      font-family: 'JetBrains Mono'; text-transform: uppercase; font-size: 0.8rem;
      color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid var(--panel-border);
      padding-bottom: 10px;
    }

    /* ── Action Buttons ── */
    .btn-sm { 
      padding: 10px 20px; font-family: 'JetBrains Mono'; font-weight: 700; 
      text-transform: uppercase; cursor: pointer; transition: 0.2s; border: 1px solid var(--accent);
      background: transparent; color: var(--accent); font-size: 0.75rem;
    }
    .btn-sm:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

    /* ── Item Grid ── */
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
    .shop-item { 
      background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); padding: 15px;
      transition: 0.3s;
    }
    .shop-item:hover { border-color: var(--accent); }
    .shop-item-name { font-weight: 900; text-transform: uppercase; font-size: 0.85rem; }
    .shop-item-price { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 1.1rem; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="logo">> ORBIT_AUTH</div>
    <input type="password" id="pwd-input" placeholder="ACCESS_KEY..." />
    <button class="btn-sm" style="width:100%" id="login-btn">INITIALIZE</button>
    <div style="color:var(--danger); font-size: 0.7rem; margin-top: 10px;" id="login-error"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
